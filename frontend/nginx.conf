# Static hosting for a single-page application.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the paths. A reload on /faculty/review is a request nginx
    # has no file for, and answering 404 would break every link the app hands
    # out, so unknown paths return the app and let it route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The built assets are content-hashed, so they can be cached hard. index.html
    # must not be, or a rebuild is invisible until someone clears their cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The API, served from this same origin.
    #
    # The bundle used to carry an absolute http://localhost:8090 address, which
    # is only ever correct on the machine the stack is running on: open the
    # interface from anywhere else -- another laptop on the network, a tunnel,
    # a hosted deployment -- and every request goes to a port on the viewer's
    # own computer. Proxying here instead means the browser only ever talks to
    # the host it loaded the page from, whatever that host happens to be, and
    # there is no cross-origin request left to configure.
    location /api/ {
        proxy_pass         http://review-api:8080/api/;
        proxy_http_version 1.1;

        # Dropped deliberately, and this is the subtle one.
        #
        # A browser sends Origin on every POST, including same-origin ones. The
        # API keeps an allow-list for the development setup, where the Vite
        # server really is a different origin, and it answers 403 "Invalid CORS
        # request" to anything not on that list. Served from here the request is
        # same-origin -- the browser enforced that before it was sent -- but the
        # header still arrives naming whichever host is in front, which on a
        # tunnel changes every run and can never be on a list compiled in
        # advance. The symptom is a page that loads perfectly and then refuses
        # every login, which looks like wrong credentials and is not.
        #
        # Safe to drop here because this deployment authenticates with a bearer
        # token read from local storage rather than a cookie, so Origin is not
        # carrying a CSRF guarantee that anything relies on.
        proxy_set_header   Origin            "";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The rendered ECGs are a couple of megabytes each and are read as
        # blobs, so they must not be buffered to a temporary file first.
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
