# Static hosting for a single-page application.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the paths. A reload on /faculty/review is a request nginx
    # has no file for, and answering 404 would break every link the app hands
    # out, so unknown paths return the app and let it route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The built assets are content-hashed, so they can be cached hard. index.html
    # must not be, or a rebuild is invisible until someone clears their cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The API, served from this same origin.
    #
    # The bundle used to carry an absolute http://localhost:8090 address, which
    # is only ever correct on the machine the stack is running on: open the
    # interface from anywhere else -- another laptop on the network, a tunnel,
    # a hosted deployment -- and every request goes to a port on the viewer's
    # own computer. Proxying here instead means the browser only ever talks to
    # the host it loaded the page from, whatever that host happens to be, and
    # there is no cross-origin request left to configure.
    location /api/ {
        proxy_pass         http://review-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The rendered ECGs are a couple of megabytes each and are read as
        # blobs, so they must not be buffered to a temporary file first.
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
